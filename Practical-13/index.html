<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Asynchronous AJAX/Fetch-Based CRUD with Zero Page Reload">
    <title>StudentHub - Asynchronous AJAX CRUD (Practical 13)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1>⚡ Asynchronous Events API &amp; AJAX CRUD</h1>
                <p style="color:var(--text-secondary);">Practical 13: Zero Page Reload, Fetch API, Debounced Live Search &amp; RESTful JSON Endpoints</p>
            </div>
            <button class="btn btn-success" id="openAddBtn">+ Create Event (AJAX)</button>
        </header>

        <!-- Controls: Debounced Search & Category Filter -->
        <div class="card">
            <div class="controls-grid">
                <div>
                    <label for="searchInput">🔍 Live Search (300ms Debounce)</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="Type title or venue to filter asynchronously...">
                </div>
                <div>
                    <label for="categoryFilter">Category Filter</label>
                    <select id="categoryFilter" class="form-control">
                        <option value="ALL">All Categories</option>
                        <option value="Hackathon">Hackathon</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Symposium">Symposium</option>
                        <option value="Cultural">Cultural</option>
                    </select>
                </div>
            </div>

            <!-- Asynchronous Data Table -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Event Details</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Venue</th>
                            <th>Capacity</th>
                            <th style="text-align: right;">Asynchronous Actions</th>
                        </tr>
                    </thead>
                    <tbody id="eventsTableBody">
                        <!-- Rendered via JavaScript Fetch API -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form (For Both Async Create & Async Update) -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Create New Campus Event</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>

            <form id="eventForm">
                <div class="form-group">
                    <label for="evTitle">Event Title *</label>
                    <input type="text" id="evTitle" class="form-control" placeholder="e.g. Charusat HackFest 2026" required>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;" class="form-group">
                    <div>
                        <label for="evCategory">Category *</label>
                        <select id="evCategory" class="form-control" required>
                            <option value="Hackathon">Hackathon</option>
                            <option value="Workshop">Workshop</option>
                            <option value="Symposium">Symposium</option>
                            <option value="Cultural">Cultural</option>
                        </select>
                    </div>
                    <div>
                        <label for="evDate">Event Date *</label>
                        <input type="date" id="evDate" class="form-control" value="2026-11-20" required>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 2fr 1fr; gap:12px;" class="form-group">
                    <div>
                        <label for="evVenue">Venue *</label>
                        <input type="text" id="evVenue" class="form-control" placeholder="CSPIT Lab 3" required>
                    </div>
                    <div>
                        <label for="evCapacity">Capacity *</label>
                        <input type="number" id="evCapacity" class="form-control" value="100" min="1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="evDescription">Description</label>
                    <textarea id="evDescription" class="form-control" rows="3" placeholder="Brief event description..."></textarea>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                    <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveEventBtn">Save via AJAX</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
