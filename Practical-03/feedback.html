<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive Feedback Form - Practical 3 Extension">
    <title>StudentHub - Responsive Feedback</title>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">🎓 StudentHub</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="feedback.html" class="active">Feedback</a></li>
                </ul>
            </nav>
            <div class="nav-auth">
                <a href="register.html" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="breadcrumb-trail">
            <a href="index.html">Home</a> <span>›</span> <strong>Responsive Feedback</strong>
        </div>

        <section class="card" style="max-width: 650px; margin: 0 auto;">
            <h1>Student Portal Feedback</h1>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">We value your insights. This form renders cleanly across all screen sizes.</p>

            <form action="feedback.html" method="post">
                <div class="form-group">
                    <label for="fbName">Your Name (Optional)</label>
                    <input type="text" id="fbName" class="form-control" placeholder="Anonymous or Full Name">
                </div>

                <div class="form-group">
                    <label for="fbRating">Experience Rating</label>
                    <select id="fbRating" class="form-control" required>
                        <option value="5">⭐⭐⭐⭐⭐ Excellent (5 Stars)</option>
                        <option value="4">⭐⭐⭐⭐ Good (4 Stars)</option>
                        <option value="3">⭐⭐⭐ Satisfactory (3 Stars)</option>
                        <option value="2">⭐⭐ Needs Improvement (2 Stars)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fbComments">Suggestions &amp; Comments</label>
                    <textarea id="fbComments" class="form-control" rows="5" required placeholder="Write your feedback..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Send Evaluation</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 CHARUSAT FTE - Responsive Feedback Practical 3</p>
        </div>
    </footer>
</body>
</html>
